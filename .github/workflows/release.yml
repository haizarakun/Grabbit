# タグ(v*)か release ブランチへ push すると、Windows / macOS / Linux 版を自動ビルドして Releases に置く
# (タグ名はアプリのバージョンから v1.0.0 のように自動で付く)
name: release
on:
  push:
    tags: ["v*"]
    branches: [release]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  # 配る前の点検。ここで失敗したら配布ファイルは作らない(壊れた版を全員に配らないため)
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - name: 単体テスト
        working-directory: src-tauri
        run: cargo test --locked
      - name: 画面のコードの文法チェック
        run: for f in ui/*.js ui/lang/*.js; do node --check "$f"; done

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # アプリ本体の自動更新用の署名鍵(リポジトリの Secrets に登録する)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Grabbit v__VERSION__
          args: ${{ matrix.args }}
          includeUpdaterJson: true

  # 配布ページの説明を、OS ごとのダウンロード表にする(.github/release-notes.md の __VERSION__ を置き換える)
  notes:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          sed "s/__VERSION__/$VERSION/g" .github/release-notes.md > notes.md
          gh release edit "v$VERSION" --notes-file notes.md
